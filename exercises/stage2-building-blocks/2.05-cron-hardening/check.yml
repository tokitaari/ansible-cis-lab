---
- name: Check 2.05 - cron hardening
  hosts: targets
  become: true
  gather_facts: true
  gather_subset: [min]
  vars:
    cron_service:
      Debian: cron
      RedHat: crond
      Suse: cron
      Archlinux: cronie
      Alpine: crond
    cron_paths: [/etc/crontab, /etc/cron.hourly, /etc/cron.daily, /etc/cron.weekly, /etc/cron.monthly, /etc/cron.d, /etc/crontabs]
  tasks:
    - name: Stat cron paths
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ cron_paths }}"
      register: st

    - name: No group/other permissions, owned by root
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - not (item.stat.rgrp or item.stat.wgrp or item.stat.xgrp)
          - not (item.stat.roth or item.stat.woth or item.stat.xoth)
        fail_msg: "{{ item.item }} is {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }}"
        quiet: true
      loop: "{{ st.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Stat cron.allow
      ansible.builtin.stat:
        path: /etc/cron.allow
      register: allow

    - name: cron.allow exists (except Alpine)
      ansible.builtin.assert:
        that:
          - allow.stat.exists
          - allow.stat.pw_name == 'root'
          - not (allow.stat.roth or allow.stat.woth or allow.stat.wgrp)
        fail_msg: /etc/cron.allow missing or too permissive
        quiet: true
      when: ansible_facts.os_family != 'Alpine'

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Cron service enabled and running
      vars:
        svc: "{{ ansible_facts.services[cron_service[ansible_facts.os_family] ~ '.service'] | default(ansible_facts.services[cron_service[ansible_facts.os_family]] | default({})) }}"
      ansible.builtin.assert:
        that:
          - svc.state | default('') in ['running', 'started']
          - svc.status | default('') == 'enabled'
        fail_msg: "{{ cron_service[ansible_facts.os_family] }}: state={{ svc.state | default('missing') }} status={{ svc.status | default('missing') }}"
        quiet: true
