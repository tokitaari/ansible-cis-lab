---
- name: CIS 5.1 - SSH server hardening
  hosts: targets
  become: true
  vars:
    sshd_log_level: VERBOSE
    sshd_permit_root_login: "no"
    sshd_max_auth_tries: 4
    sshd_max_sessions: 10
    sshd_max_startups: "10:30:60"
    sshd_login_grace_time: 60
    sshd_client_alive_interval: 15
    sshd_client_alive_count_max: 3
    sshd_banner: /etc/issue.net
    sshd_allow_groups: [ansible]
    sshd_ciphers:
      - chacha20-poly1305@openssh.com
      - aes256-gcm@openssh.com
      - aes128-gcm@openssh.com
      - aes256-ctr
      - aes192-ctr
      - aes128-ctr
    sshd_macs:
      - hmac-sha2-512-etm@openssh.com
      - hmac-sha2-256-etm@openssh.com
      - umac-128-etm@openssh.com
      - hmac-sha2-512
      - hmac-sha2-256
    sshd_kex_algorithms:
      - mlkem768x25519-sha256
      - sntrup761x25519-sha512@openssh.com
      - curve25519-sha256
      - curve25519-sha256@libssh.org
      - diffie-hellman-group16-sha512
      - diffie-hellman-group18-sha512
      - diffie-hellman-group-exchange-sha256
  tasks:
    - name: Deploy sshd hardening drop-in
      ansible.builtin.template:
        src: sshd_cis.conf.j2
        dest: /etc/ssh/sshd_config.d/00-cis-hardening.conf
        owner: root
        group: root
        mode: "0600"
        validate: /usr/sbin/sshd -t -f %s
      notify: Reload sshd

    - name: Validate the complete sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts.os_family == 'Debian' else 'sshd' }}"
        state: reloaded
