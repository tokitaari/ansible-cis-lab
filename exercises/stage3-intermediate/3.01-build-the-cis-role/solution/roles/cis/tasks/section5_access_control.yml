---
- name: 5.1 | Deploy sshd hardening drop-in
  ansible.builtin.template:
    src: sshd_cis.conf.j2
    dest: /etc/ssh/sshd_config.d/00-cis-hardening.conf
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload sshd
  tags: [ssh]

- name: 5.1 | Validate the complete sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
  check_mode: false
  tags: [ssh]

- name: 5.2 | Harden sudo defaults
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-cis
    content: |
      Defaults use_pty
      Defaults logfile="{{ cis_sudo_logfile }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  tags: [sudo]
