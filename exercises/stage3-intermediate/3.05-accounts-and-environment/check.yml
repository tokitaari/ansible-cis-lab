---
- name: Check 3.05 - accounts and environment
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Read files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/passwd, /etc/shadow, /etc/profile.d/50-cis-umask.sh, /etc/profile.d/50-cis-tmout.sh]
      register: f
      failed_when: false

    - name: Evaluate
      vars:
        passwd: "{{ f.results[0].content | b64decode }}"
        shadow: "{{ f.results[1].content | b64decode }}"
        umask_file: "{{ f.results[2].content | default('') | b64decode }}"
        tmout_file: "{{ f.results[3].content | default('') | b64decode }}"
        uid0: "{{ passwd.splitlines() | map('split', ':') | selectattr('2', 'equalto', '0') | map(attribute='0') | list }}"
        empty: "{{ shadow.splitlines() | map('split', ':') | selectattr('1', 'equalto', '') | map(attribute='0') | list }}"
      ansible.builtin.assert:
        that:
          - uid0 == ['root']
          - empty | length == 0
          - umask_file is search('(?m)^\s*umask\s+0?27\s*$')
          - tmout_file is search('(?m)^\s*(export\s+|readonly\s+)?TMOUT=(\d+)')
          - (tmout_file | regex_search('TMOUT=(\d+)', '\\1') | first | int) <= 900
          - tmout_file is search('(?m)^\s*readonly\s+TMOUT')
        fail_msg: "UID 0: {{ uid0 }}, empty passwords: {{ empty }}; umask/TMOUT files must be in /etc/profile.d"
        quiet: true
