---
- name: CIS 5.3 - account lockout (Red Hat family)
  hosts: redhat_family
  become: true
  vars:
    cis_faillock:
      deny: 5
      unlock_time: 900
  tasks:
    - name: Read the active authselect configuration
      ansible.builtin.command: authselect current
      register: cis_authselect
      changed_when: false
      check_mode: false

    - name: Enable the with-faillock feature if missing
      ansible.builtin.command: authselect enable-feature with-faillock
      when: "'with-faillock' not in cis_authselect.stdout"
      changed_when: true

    - name: Configure faillock thresholds
      ansible.builtin.lineinfile:
        path: /etc/security/faillock.conf
        regexp: '^\s*#?\s*{{ item.key }}\s*='
        line: "{{ item.key }} = {{ item.value }}"
      loop: "{{ cis_faillock | dict2items }}"
