---
- name: CIS 6.1 - file integrity with AIDE
  hosts: debian_family:redhat_family
  become: true
  vars:
    cis_aide_platform:
      Debian:
        packages: [aide, aide-common]
        binary: /usr/bin/aide
        config: /etc/aide/aide.conf
        db: /var/lib/aide/aide.db
        init_cmd: aideinit -y -f
      RedHat:
        packages: [aide]
        binary: /usr/sbin/aide
        config: /etc/aide.conf
        db: /var/lib/aide/aide.db.gz
        init_cmd: sh -c 'aide --init && mv /var/lib/aide/aide.db.new.gz /var/lib/aide/aide.db.gz'
    cis_aide: "{{ cis_aide_platform[ansible_facts.os_family] }}"
  tasks:
    # The Debian/Ubuntu targets ship without a package index (like most container images).
    # cache_valid_time alone does not help: apt judges the age by the mtime of
    # /var/lib/apt/lists, which the image build touched - an empty index looks fresh.
    # So look for index files first. The index is a cache, not configuration:
    # changed_when false keeps the play idempotent.
    - name: Look for an apt package index
      ansible.builtin.find:
        paths: /var/lib/apt/lists
        patterns: "*_Packages*"
      register: cis_apt_lists
      check_mode: false
      when: ansible_facts.os_family == 'Debian'

    - name: Refresh the apt package index (missing, or older than a day)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: "{{ 0 if cis_apt_lists.matched == 0 else 86400 }}"
      changed_when: false
      check_mode: false  # apt skips the update in check mode -> --check on a fresh host fails
      when: ansible_facts.os_family == 'Debian'

    - name: Install AIDE
      ansible.builtin.package:
        name: "{{ cis_aide.packages }}"
        state: present

    # With poll: 0 the task result only says "job started" - always changed. The module and
    # its creates: run later in the background, too late for the task status. So decide
    # before starting the job; creates: stays as a last guard inside the job (it does not stop
    # a second run that starts while the first job is still scanning).
    - name: Look for an existing database
      ansible.builtin.stat:
        path: "{{ cis_aide.db }}"
      register: cis_aide_db

    - name: Build the initial database in the background
      ansible.builtin.command:
        cmd: "{{ cis_aide.init_cmd }}"
        creates: "{{ cis_aide.db }}"
      async: 1800
      poll: 0
      register: cis_aide_job
      when: not cis_aide_db.stat.exists

    - name: Wait for the database
      ansible.builtin.async_status:
        jid: "{{ cis_aide_job.ansible_job_id }}"
      register: cis_aide_result
      until: cis_aide_result.finished
      retries: 120
      delay: 15
      when: cis_aide_job.ansible_job_id is defined

    - name: Integrity check units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop: [cis-aidecheck.service, cis-aidecheck.timer]
      register: cis_aide_units

    - name: Enable and start the daily timer
      ansible.builtin.systemd_service:
        name: cis-aidecheck.timer
        enabled: true
        state: started
        daemon_reload: "{{ cis_aide_units is changed }}"
