---
# pam-config based PAM handling is left as an exercise (see 3.03 bonus)
cis_sshd_service: sshd
cis_cron_service: cron
cis_cron_allow_supported: true
cis_shadow_group: shadow
cis_shadow_mode: "0640"
cis_audit_package: audit
# How PAM is managed on this platform: pam-auth-update | authselect | manual | none
cis_pam_tool: manual
cis_pwquality_supported: false
cis_pwquality_package: ''
cis_pam_password_stack: /etc/pam.d/common-password
