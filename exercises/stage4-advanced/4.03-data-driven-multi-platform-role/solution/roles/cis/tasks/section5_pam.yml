---
- name: 5.3.3 | Install pwquality
  ansible.builtin.package:
    name: "{{ cis_pwquality_package }}"
    state: present
  when: cis_pwquality_supported

- name: 5.3.3 | Drop-in directory
  ansible.builtin.file:
    path: /etc/security/pwquality.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: cis_pwquality_supported

- name: 5.3.3 | Password quality settings
  ansible.builtin.template:
    src: pwquality-cis.conf.j2
    dest: /etc/security/pwquality.conf.d/50-cis.conf
    owner: root
    group: root
    mode: "0644"
  when: cis_pwquality_supported

- name: 5.3.3 | Read the PAM password stack
  ansible.builtin.slurp:
    src: "{{ cis_pam_password_stack }}"
  register: cis_pam_stack
  when: cis_pwquality_supported

- name: 5.3.3 | pam-auth-update platforms - enable the pwquality profile if missing
  ansible.builtin.command: pam-auth-update --enable pwquality
  when:
    - cis_pam_tool == 'pam-auth-update'
    - "'pam_pwquality' not in (cis_pam_stack.content | b64decode)"
  changed_when: true

- name: 5.3.3 | authselect platforms - pam_pwquality must be in the selected profile
  ansible.builtin.assert:
    that: "'pam_pwquality' in (cis_pam_stack.content | b64decode)"
    fail_msg: pam_pwquality missing - select an authselect profile that includes it
    quiet: true
  when: cis_pam_tool == 'authselect'
