---
- name: CIS 4 - host firewall with nftables
  hosts: targets:!suse_family
  become: true
  vars:
    cis_fw_ssh_sources:
      - "{{ ansible_facts.default_ipv4.network }}/{{ ansible_facts.default_ipv4.prefix }}"
    cis_fw_rollback_seconds: 60
    cis_fw_persist_file:
      Debian: /etc/nftables.conf
      RedHat: /etc/sysconfig/nftables.conf
      Archlinux: /etc/nftables.conf
      Alpine: /etc/nftables.nft
  tasks:
    - name: Install nftables
      ansible.builtin.package:
        name: nftables
        state: present

    - name: Directory for the CIS ruleset
      ansible.builtin.file:
        path: /etc/cis
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Render and validate the ruleset
      ansible.builtin.template:
        src: nftables-cis.nft.j2
        dest: /etc/cis/nftables-cis.nft
        owner: root
        group: root
        mode: "0640"
        validate: nft -c -f %s
      register: cis_fw_file

    - name: Is our table loaded?
      ansible.builtin.command: nft list table inet cis_filter
      register: cis_fw_live
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Activate with a dead-man switch
      when: cis_fw_file is changed or cis_fw_live.rc != 0
      block:
        - name: Arm rollback (deletes our table unless cancelled)
          ansible.builtin.shell: >-
            nohup sh -c 'sleep {{ cis_fw_rollback_seconds }}; nft delete table inet cis_filter'
            >/dev/null 2>&1 & echo $!
          register: cis_fw_rollback
          changed_when: false

        - name: Load the ruleset
          ansible.builtin.command: nft -f /etc/cis/nftables-cis.nft
          changed_when: true

        - name: Drop the persistent SSH connection
          ansible.builtin.meta: reset_connection

        - name: A new connection must still work
          ansible.builtin.wait_for_connection:
            timeout: 20

        - name: Disarm rollback
          ansible.builtin.command: "kill {{ cis_fw_rollback.stdout | trim }}"
          changed_when: false

    - name: Persist via the distribution's nftables config (include only - no flush)
      ansible.builtin.copy:
        dest: "{{ cis_fw_persist_file[ansible_facts.os_family] }}"
        content: |
          #!/usr/sbin/nft -f
          # Managed by Ansible. Rules live in /etc/cis/nftables-cis.nft.
          # No 'flush ruleset' here: other components (Docker, k8s) own rules too.
          include "/etc/cis/nftables-cis.nft"
        owner: root
        group: root
        mode: "0640"

    - name: Load at boot (enable only - a restart would flush foreign rules)
      ansible.builtin.service:
        name: nftables
        enabled: true
