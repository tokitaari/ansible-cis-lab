---
- name: Check 1.04 - vsftpd not running and not enabled
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Pick the vsftpd entry (systemd or OpenRC naming)
      ansible.builtin.set_fact:
        vsftpd_svc: "{{ ansible_facts.services['vsftpd.service'] | default(ansible_facts.services['vsftpd'] | default({})) }}"

    # Enabled: systemd/sysv report status=enabled; OpenRC (Alpine) reports no status, only the
    # runlevels the service is added to.
    - name: vsftpd is stopped and disabled (or absent)
      vars:
        vsftpd_enabled: "{{ vsftpd_svc.status | default('') == 'enabled' or 'default' in (vsftpd_svc.runlevels | default([], true)) }}"
      ansible.builtin.assert:
        that:
          - vsftpd_svc.state | default('stopped') not in ['running', 'started']
          - not (vsftpd_enabled | bool)
        fail_msg: >-
          vsftpd state={{ vsftpd_svc.state | default('-') }} status={{ vsftpd_svc.status | default('-') }}
          runlevels={{ vsftpd_svc.runlevels | default('-') }}
        success_msg: "{{ 'vsftpd stopped/disabled' if vsftpd_svc else 'vsftpd not present' }}"
        quiet: true
