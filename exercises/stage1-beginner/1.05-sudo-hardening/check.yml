---
- name: Check 1.05 - sudo hardening
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Stat the sudoers drop-in
      ansible.builtin.stat:
        path: /etc/sudoers.d/50-cis
      register: st

    - name: Read the drop-in
      ansible.builtin.slurp:
        src: /etc/sudoers.d/50-cis
      register: content
      when: st.stat.exists

    - name: Full sudoers configuration is valid
      ansible.builtin.command: /usr/sbin/visudo -c
      register: visudo
      changed_when: false
      check_mode: false
      failed_when: false

    # openSUSE Leap 16 ships the vendor file /usr/etc/sudoers with mode 0444, so 'visudo -c'
    # exits 1 even on an untouched host. Only that complaint is tolerated, any other line
    # (syntax/parse errors, bad permissions on files in /etc) still fails.
    - name: use_pty and logfile configured
      vars:
        text: "{{ content.content | default('') | b64decode }}"
        visudo_problems: >-
          {{ (visudo.stdout_lines + visudo.stderr_lines) | reject('search', ': parsed OK$')
                         | reject('match', '^/usr/etc/[^:]+: bad permissions') | list }}
      ansible.builtin.assert:
        that:
          - st.stat.exists
          - st.stat.mode == '0440'
          - st.stat.pw_name == 'root'
          - text is search('(?m)^\s*Defaults\s+use_pty\s*$')
          - text is search('(?m)^\s*Defaults\s+logfile\s*=\s*"?/var/log/sudo\.log"?\s*$')
          - visudo.rc == 0 or visudo_problems | length == 0
        fail_msg: >-
          /etc/sudoers.d/50-cis must exist (0440 root) with 'Defaults use_pty' and
          'Defaults logfile="/var/log/sudo.log"'; visudo -c rc={{ visudo.rc }} {{ visudo_problems }}
        quiet: true
