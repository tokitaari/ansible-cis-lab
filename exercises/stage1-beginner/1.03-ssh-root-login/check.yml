---
- name: Check 1.03 - sshd root login and empty passwords
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Read the effective sshd configuration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../_common/sshd_effective.yml"

    - name: Stat the drop-in
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/00-cis-hardening.conf
      register: st

    - name: Root login and empty passwords are refused
      ansible.builtin.assert:
        that:
          - sshd_cfg.permitrootlogin == 'no'
          - sshd_cfg.permitemptypasswords == 'no'
          - st.stat.exists
          - st.stat.mode == '0600'
          - st.stat.pw_name == 'root'
        fail_msg: >-
          effective: permitrootlogin={{ sshd_cfg.permitrootlogin }},
          permitemptypasswords={{ sshd_cfg.permitemptypasswords }};
          drop-in exists={{ st.stat.exists }} mode={{ st.stat.mode | default('-') }}
        quiet: true
