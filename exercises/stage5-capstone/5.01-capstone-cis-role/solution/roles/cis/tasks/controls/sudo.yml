---
- name: 5.2 | Harden sudo defaults
  ansible.builtin.copy:
    dest: /etc/sudoers.d/50-cis
    content: |
      Defaults use_pty
      Defaults logfile="{{ cis_sudo_logfile }}"
    owner: root
    group: root
    mode: "0440"
    validate: /usr/sbin/visudo -cf %s
  register: cis_r_1

- name: 5.2 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}"]
