---
- name: 1.5 | Ensure /etc/sysctl.d exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: cis_r_0

- name: 1.5 | Persist global kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value | string }}"
    sysctl_file: /etc/sysctl.d/60-cis-kernel.conf
    sysctl_set: "{{ cis_apply_global_sysctl }}"
    reload: "{{ cis_apply_global_sysctl }}"
  loop: "{{ cis_sysctl_kernel | dict2items }}"
  # in audit mode a missing directory is already the finding
  when: not (cis_mode == 'audit' and cis_r_0 is changed)
  register: cis_r_1

- name: 1.5 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_0 }}", "{{ cis_r_1 }}"]
