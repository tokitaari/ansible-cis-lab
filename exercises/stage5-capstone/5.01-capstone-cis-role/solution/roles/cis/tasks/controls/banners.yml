---
- name: 1.6 | Deploy login warning banners
  ansible.builtin.template:
    src: banner.j2
    dest: "{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cis_banner_files }}"
  register: cis_r_1

- name: 1.6 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}"]
