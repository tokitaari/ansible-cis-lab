---
- name: 2.4 | Find existing cron paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ cis_cron_paths }}"
  register: cis_cron_stat

- name: 2.4 | Restrict cron files and directories
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    owner: root
    group: root
    mode: "{{ item.item.mode }}"
  loop: "{{ cis_cron_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.stat.exists
  register: cis_r_1

- name: 2.4 | Restrict crontab usage to root
  ansible.builtin.copy:
    dest: /etc/cron.allow
    content: "root\n"
    owner: root
    group: root
    mode: "0640"
  when: cis_cron_allow_supported
  register: cis_r_2

- name: 2.4 | Remove cron.deny
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  when: cis_cron_allow_supported
  register: cis_r_3

- name: 2.4 | Restrict the cron spool where cron.allow is not supported
  ansible.builtin.file:
    path: /etc/crontabs
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not cis_cron_allow_supported
  register: cis_r_4

- name: 2.4 | Cron daemon is enabled and running
  ansible.builtin.service:
    name: "{{ cis_cron_service }}"
    state: started
    enabled: true
  register: cis_r_5

- name: 2.4 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}", "{{ cis_r_2 }}", "{{ cis_r_3 }}", "{{ cis_r_4 }}", "{{ cis_r_5 }}"]
