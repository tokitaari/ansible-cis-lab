---
- name: Load platform specific variables
  ansible.builtin.include_vars: "{{ lookup('ansible.builtin.first_found', cis_vars_candidates) }}"
  vars:
    cis_vars_candidates:
      files:
        - "{{ ansible_facts.distribution }}-{{ ansible_facts.distribution_major_version }}.yml"
        - "{{ ansible_facts.distribution }}.yml"
        - "{{ ansible_facts.os_family }}.yml"
        - default.yml
      paths:
        - "{{ role_path }}/vars"
  tags: [always]

# Debian/Ubuntu container images ship without a package index; without it every package
# install fails. cache_valid_time alone does not help: apt judges the age by the mtime of
# /var/lib/apt/lists, which the image build touched - an empty index looks fresh. So look
# for index files first. The index is a cache, not configuration -> no 'changed', also in
# check mode.
- name: Look for an apt package index
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    patterns: "*_Packages*"
  register: cis_apt_lists
  check_mode: false
  when: cis_apt_cache_refresh
  tags: [always]

- name: Refresh the apt package index (missing, or older than a day)
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ 0 if cis_apt_lists.matched == 0 else 86400 }}"
  changed_when: false
  check_mode: false
  when: cis_apt_cache_refresh
  tags: [always]

- name: Validate input
  ansible.builtin.import_tasks: preflight.yml

- name: Start with an empty result list
  ansible.builtin.set_fact:
    cis_findings: []

- name: Run every control of the registry
  ansible.builtin.include_tasks:
    file: control.yml
  loop: "{{ cis_controls }}"
  loop_control:
    loop_var: cis_control
    label: "{{ cis_control.id }}"
  when: cis_controls_only | length == 0 or cis_control.id in cis_controls_only

- name: Write the compliance report
  ansible.builtin.import_tasks: report.yml
