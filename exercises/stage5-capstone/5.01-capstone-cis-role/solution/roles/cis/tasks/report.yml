---
- name: Report | summarise per host
  ansible.builtin.set_fact:
    cis_summary:
      mode: "{{ cis_mode }}"
      level: "{{ cis_level | int }}"
      platform: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
      counts: >-
        {%- set ns = namespace(c={}) -%}
        {%- for s in ['pass', 'fixed', 'fail', 'excepted', 'out-of-profile', 'not-applicable'] -%}
          {%- set ns.c = ns.c | combine({s: cis_findings | selectattr('status', 'equalto', s) | list | length}) -%}
        {%- endfor -%}
        {{ ns.c }}
      findings: "{{ cis_findings }}"

- name: Report | create the report directory
  ansible.builtin.file:
    path: "{{ cis_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false

- name: Report | write JSON
  vars:
    # Every host that has run the role in this playbook run - not ansible_play_hosts: under
    # 'serial' (5.02) that lists the hosts of later batches too, which have no cis_summary yet.
    # hostvars survive across plays, so the canary play's hosts stay in the report and the
    # last batch writes the complete one.
    cis_report_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('cis_summary', 'defined') | map(attribute='inventory_hostname') | sort }}"
  ansible.builtin.copy:
    dest: "{{ cis_report_dir }}/compliance.json"
    content: "{{ dict(cis_report_hosts | zip(cis_report_hosts | map('extract', hostvars, 'cis_summary'))) | to_nice_json }}\n"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false

- name: Report | write Markdown
  vars:
    # same host list as the JSON report
    cis_report_hosts: "{{ groups['all'] | map('extract', hostvars) | selectattr('cis_summary', 'defined') | map(attribute='inventory_hostname') | sort }}"
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ cis_report_dir }}/compliance.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false
