---
# ---- general -------------------------------------------------------------
# enforce = remediate and report; audit = change nothing, only report
cis_mode: enforce
# 1 = CIS Level 1, 2 = Level 1 + Level 2 controls
cis_level: 1
# Documented deviations. Every entry needs id, reason and an expiry date:
# cis_exceptions:
#   - id: "5.1"
#     reason: Legacy jump host needs SSH agent forwarding (CHG-1234)
#     expires: 2027-06-30
cis_exceptions: []
# Run only these control ids (empty = all)
cis_controls_only: []
# Where the compliance report is written on the control node
cis_report_dir: "{{ playbook_dir }}/reports"
# Global (non-namespaced) kernel settings must not be applied inside containers
cis_apply_global_sysctl: "{{ not (lab_in_container | default(false)) }}"

# ---- section 1: initial setup ------------------------------------------
cis_disabled_modules_l1: [cramfs, freevxfs, hfs, hfsplus, jffs2, usb-storage]
cis_disabled_modules_l2: [squashfs, udf, dccp, tipc, rds, sctp]
cis_banner_org: "{{ lab_org_name | default('Example Corp') }}"
cis_banner_files: [/etc/motd, /etc/issue, /etc/issue.net]

# ---- section 2: services -----------------------------------------------
cis_remove_packages: [telnet]
cis_disable_services: [vsftpd]
cis_cron_paths:
  - {path: /etc/crontab, mode: "0600"}
  - {path: /etc/cron.hourly, mode: "0700"}
  - {path: /etc/cron.daily, mode: "0700"}
  - {path: /etc/cron.weekly, mode: "0700"}
  - {path: /etc/cron.monthly, mode: "0700"}
  - {path: /etc/cron.d, mode: "0700"}

# ---- section 3: network ------------------------------------------------
cis_sysctl_network:
  net.ipv4.ip_forward: 0
  net.ipv4.conf.all.send_redirects: 0
  net.ipv4.conf.default.send_redirects: 0
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.default.accept_redirects: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.conf.default.secure_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.default.accept_source_route: 0
  net.ipv4.conf.all.log_martians: 1
  net.ipv4.conf.default.log_martians: 1
  net.ipv4.icmp_echo_ignore_broadcasts: 1
  net.ipv4.icmp_ignore_bogus_error_responses: 1
  net.ipv4.conf.all.rp_filter: 1
  net.ipv4.conf.default.rp_filter: 1
  net.ipv4.tcp_syncookies: 1
cis_sysctl_kernel:
  kernel.randomize_va_space: 2
  fs.suid_dumpable: 0
  kernel.yama.ptrace_scope: 1

# ---- section 5: access control -----------------------------------------
cis_sshd_log_level: VERBOSE
cis_sshd_permit_root_login: "no"
cis_sshd_max_auth_tries: 4
cis_sshd_max_sessions: 10
cis_sshd_max_startups: "10:30:60"
cis_sshd_login_grace_time: 60
cis_sshd_client_alive_interval: 15
cis_sshd_client_alive_count_max: 3
cis_sshd_banner: /etc/issue.net
cis_sshd_allow_groups: [ansible]
cis_sshd_ciphers:
  - chacha20-poly1305@openssh.com
  - aes256-gcm@openssh.com
  - aes128-gcm@openssh.com
  - aes256-ctr
  - aes192-ctr
  - aes128-ctr
cis_sshd_macs:
  - hmac-sha2-512-etm@openssh.com
  - hmac-sha2-256-etm@openssh.com
  - umac-128-etm@openssh.com
  - hmac-sha2-512
  - hmac-sha2-256
cis_sshd_kex_algorithms:
  - mlkem768x25519-sha256
  - sntrup761x25519-sha512@openssh.com
  - curve25519-sha256
  - curve25519-sha256@libssh.org
  - diffie-hellman-group16-sha512
  - diffie-hellman-group18-sha512
  - diffie-hellman-group-exchange-sha256
cis_sudo_logfile: /var/log/sudo.log

# ---- section 7: system maintenance -------------------------------------
cis_shadow_paths: [/etc/shadow, /etc/gshadow, /etc/shadow-, /etc/gshadow-]

# ---- section 5: password policy, PAM, accounts (stage 3) -------------------
cis_login_defs:
  PASS_MAX_DAYS: 365
  PASS_MIN_DAYS: 1
  PASS_WARN_AGE: 7
cis_inactive_days: 45
cis_strong_hash_methods: [SHA512, YESCRYPT]
cis_pwquality:
  minlen: 14
  minclass: 4
  maxrepeat: 3
  maxsequence: 3
  dictcheck: 1
cis_umask: "027"
cis_tmout: 900

# ---- section 6: logging and auditing (Level 2) -----------------------------
# The audit subsystem is host-global: never start auditd inside the lab containers
cis_manage_auditd_service: "{{ not (lab_in_container | default(false)) }}"
cis_auditd_conf:
  max_log_file_action: keep_logs
  space_left_action: email
  action_mail_acct: root
  admin_space_left_action: single

cis_audit_rules:
  scope:
    - -w /etc/sudoers -p wa -k scope
    - -w /etc/sudoers.d -p wa -k scope
  user_emulation:
    - -a always,exit -F arch=b64 -C euid!=uid -F auid!=unset -S execve -k user_emulation
  sudo_log:
    - -w /var/log/sudo.log -p wa -k sudo_log_file
  time_change:
    - -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
    - -w /etc/localtime -p wa -k time-change
  identity:
    - -w /etc/group -p wa -k identity
    - -w /etc/passwd -p wa -k identity
    - -w /etc/gshadow -p wa -k identity
    - -w /etc/shadow -p wa -k identity
    - -w /etc/security/opasswd -p wa -k identity
    - -w /etc/nsswitch.conf -p wa -k identity
    - -w /etc/pam.conf -p wa -k identity
    - -w /etc/pam.d -p wa -k identity
  logins:
    - -w /var/log/lastlog -p wa -k logins
    - -w /var/run/faillock -p wa -k logins
