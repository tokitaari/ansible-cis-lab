---
- name: Post-check | drop the persistent SSH connection
  ansible.builtin.meta: reset_connection

- name: Post-check | a fresh login still works
  ansible.builtin.wait_for_connection:
    timeout: 30

- name: Post-check | read effective sshd settings
  ansible.builtin.command: /usr/sbin/sshd -T
  register: cis_post_sshd
  changed_when: false
  check_mode: false

- name: Post-check | root login is still disabled
  ansible.builtin.assert:
    # (?i): OpenSSH 10.6 prints 'PermitRootLogin no', older releases 'permitrootlogin no'
    that: cis_post_sshd.stdout_lines | select('match', '(?i)permitrootlogin\\s+no$') | list | length == 1
    fail_msg: sshd allows root login after the rollout
    quiet: true
