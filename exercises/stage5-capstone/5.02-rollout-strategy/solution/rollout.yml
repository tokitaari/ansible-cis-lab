---
- name: Preflight - every host must be healthy, otherwise nothing happens
  hosts: targets
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars:
    cis_min_free_bytes: 209715200
  tasks:
    - name: Operator confirmed the rollout
      ansible.builtin.assert:
        that: cis_rollout_confirm | default(false) | bool
        fail_msg: "Refusing to roll out. Re-run with -e cis_rollout_confirm=true"
        quiet: true
      run_once: true

    - name: Current sshd configuration is valid
      ansible.builtin.command: /usr/sbin/sshd -t
      changed_when: false
      check_mode: false

    - name: Current sudo configuration is valid
      ansible.builtin.command: /usr/sbin/visudo -c
      changed_when: false
      check_mode: false

    - name: Enough free space on /
      vars:
        root_free: "{{ ansible_facts.mounts | selectattr('mount', 'equalto', '/') | map(attribute='size_available') | first | default(0) }}"
      ansible.builtin.assert:
        that: root_free | int >= cis_min_free_bytes
        fail_msg: "only {{ (root_free | int / 1048576) | round }} MB free on /"
        quiet: true

- name: Canary
  hosts: "{{ cis_canary | default('debian,rocky') }}"
  become: true
  roles:
    - role: cis
      vars:
        cis_mode: enforce
  post_tasks:
    - name: Verify the canary
      ansible.builtin.include_tasks: tasks/post_check.yml

- name: Remaining hosts in growing batches
  hosts: "targets:!{{ cis_canary | default('debian,rocky') | replace(',', ':!') }}"
  become: true
  serial: [1, "30%", "100%"]
  max_fail_percentage: 0
  roles:
    - role: cis
      vars:
        cis_mode: enforce
  post_tasks:
    - name: Verify the batch
      ansible.builtin.include_tasks: tasks/post_check.yml
