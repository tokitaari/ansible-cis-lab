---
- name: Gather facts from all targets
  hosts: targets
  gather_facts: true
  tasks: []

- name: Write the platform report on the control node
  hosts: localhost
  gather_facts: false
  vars:
    # 'lab' exports LAB_WORK_DIR (default /lab/work); CI checks solutions in another work dir
    report_dir: "{{ lookup('ansible.builtin.env', 'LAB_WORK_DIR', default='/lab/work') }}/0.03"
  tasks:
    - name: Ensure the work directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Render facts.csv
      ansible.builtin.template:
        src: facts.csv.j2
        dest: "{{ report_dir }}/facts.csv"
        mode: "0644"
