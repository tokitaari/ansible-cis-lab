---
name: release-check
"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release hygiene (on tags also checks the CHANGELOG section)
        run: tools/release-check.sh ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install the linters (same packages as the control image)
        run: pip install "ansible==14.*" ansible-lint yamllint
      - name: Static quality gate (yamllint, ansible-lint, meta, EN/DE parity, links, controls)
        run: tools/static-check.sh
