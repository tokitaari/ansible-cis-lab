---
# Runtime test: the reference solutions on the eight targets (tools/run-solutions.sh).
# One job per stage (solo runs), one for the chain of the cumulative exercises 3.01 -> 5.02 and
# one per fresh role run (4.03, 5.01 at both levels). Each job builds the images and starts its
# own lab on a fresh runner (privileged systemd targets need cgroup v2 - compose.yaml is used as
# it is). Building in every job costs 100-130 s (measured 2026-11-11) - no image cache.
name: runtime
"on":
  pull_request:
    paths:
      - ansible/**
      - control/**
      - targets/**
      - exercises/**
      - "!exercises/**/*.md"
      - compose.yaml
      - lab.sh
      - tools/run-solutions.sh
      - tools/stage-solution.sh
      - .github/workflows/runtime.yml
  push:
    branches: [main]
    paths:
      - ansible/**
      - control/**
      - targets/**
      - exercises/**
      - "!exercises/**/*.md"
      - compose.yaml
      - lab.sh
      - tools/run-solutions.sh
      - tools/stage-solution.sh
      - .github/workflows/runtime.yml
  schedule:
    - cron: "17 3 * * 1"    # weekly: base images and package repositories move on
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  runs:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        # longest first: the chain sets the wall time. Measured in CI (2026-11-11, whole job):
        # chain 36 min, fresh 5.01 27, fresh 4.03 20, stages 4-12. minutes = the worst case of
        # one hung run (its timeout in tools/run-solutions.sh) + the other runs + build and start,
        # so the runner's own timeout fires first and the summary and logs are still written
        include:
          - name: chain
            key: chain
            specs: chain
            minutes: 75
          - name: fresh 5.01
            key: fresh-5.01
            specs: 5.01 5.01@2
            minutes: 60
          - name: fresh 4.03
            key: fresh-4.03
            specs: 4.03 4.03@2
            minutes: 45
          - name: solo stage0
            key: stage0
            specs: stage0
            minutes: 60
          - name: solo stage1
            key: stage1
            specs: stage1
            minutes: 60
          - name: solo stage2
            key: stage2
            specs: stage2
            minutes: 60
          - name: solo stage3
            key: stage3
            specs: stage3
            minutes: 60
          - name: solo stage4
            key: stage4
            specs: stage4
            minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Runner facts
        run: |
          echo "kernel $(uname -r), $(stat -fc %T /sys/fs/cgroup), $(nproc) CPUs"
          free -h
          df -h /
          docker version --format 'docker {{.Server.Version}}'
          docker compose version
      - name: Build the images
        run: docker compose build
      - name: Start the lab
        run: ./lab.sh up
      - name: Run the reference solutions (${{ matrix.specs }})
        run: tools/run-solutions.sh --yes --logs "$RUNNER_TEMP/lab-runs" ${{ matrix.specs }}
      - name: Container state
        if: failure()
        run: |
          docker compose ps -a
          docker system df
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.key }}
          path: ${{ runner.temp }}/lab-runs
          retention-days: 14
          if-no-files-found: ignore
