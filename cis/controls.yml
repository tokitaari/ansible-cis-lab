---
# Lab control catalogue
# ---------------------------------------------------------------------------
# Own wording - NOT the CIS benchmark text. Use it to navigate between the lab
# exercises and the official CIS PDFs you place in cis/pdf/.
#
# section:   CIS section in the current (2024+) Linux benchmark structure
#            (1 Initial setup, 2 Services, 3 Network, 4 Firewall, 5 Access control,
#             6 Logging and auditing, 7 System maintenance). Recommendation numbers
#             below that level differ between benchmarks and versions - look up the
#             exact number in the PDF of your distribution.
# level:     CIS profile (1 = Level 1 Server, 2 = Level 2 Server)
# container: full    - can be configured AND verified inside the lab containers
#            config  - configuration can be written, the effect is host/kernel-wide
#                      and must not be activated from a container
#            no      - not reproducible in containers (theory / real VM only)
# exercises: lab exercises that implement the control
# platforms: notes where platforms differ

controls:
  - id: "1.1.1"
    section: 1 Initial setup / filesystem kernel modules
    title: Unneeded filesystem kernel modules cannot be loaded
    level: 1
    container: config
    exercises: ["2.03", "3.01", "5.01"]
    platforms: /etc/modprobe.d may be missing on minimal systems; module state reflects the host kernel

  - id: "1.1.2"
    section: 1 Initial setup / filesystem partitions
    title: Separate partitions and nodev/nosuid/noexec mount options (/tmp, /var, /var/tmp, /home, /dev/shm)
    level: 1
    container: "no"
    exercises: []
    platforms: needs real block devices or a VM; container mounts are controlled by the runtime

  - id: "1.2"
    section: 1 Initial setup / package management
    title: Package signatures are verified and repositories are trusted
    level: 1
    container: full
    exercises: []
    platforms: gpgcheck (dnf/zypper), signed-by (apt), SigLevel (pacman), apk keys

  - id: "1.3"
    section: 1 Initial setup / mandatory access control
    title: AppArmor or SELinux is installed, enabled and enforcing
    level: 1
    container: "no"
    exercises: []
    platforms: the LSM belongs to the host kernel; SELinux on EL/Fedora, AppArmor on Debian/Ubuntu/SUSE

  - id: "1.4"
    section: 1 Initial setup / bootloader
    title: Bootloader password and restrictive permissions on the bootloader config
    level: 1
    container: "no"
    exercises: []
    platforms: containers do not boot through GRUB

  - id: "1.5"
    section: 1 Initial setup / process hardening
    title: ASLR full, no core dumps of setuid programs, restricted ptrace
    level: 1
    container: config
    exercises: ["2.04", "3.01", "5.01"]
    platforms: kernel.* and fs.* sysctls are global - only persist them inside containers

  - id: "1.6"
    section: 1 Initial setup / warning banners
    title: Login banners contain a legal warning and no OS information
    level: 1
    container: full
    exercises: ["0.04", "2.06", "3.01", "5.01"]
    platforms: Ubuntu builds the MOTD dynamically (update-motd.d)

  - id: "2.1"
    section: 2 Services / server services
    title: Unneeded server services are removed or stopped and disabled
    level: 1
    container: full
    exercises: ["1.04", "3.01", "5.01"]
    platforms: systemd vs OpenRC

  - id: "2.2"
    section: 2 Services / client services
    title: Insecure clients (telnet, rsh, talk, ftp, NIS) are not installed
    level: 1
    container: full
    exercises: ["1.01", "3.01", "5.01"]
    platforms: package names differ (inetutils on Arch, busybox-extras on Alpine, transitional packages on Debian)

  - id: "2.3"
    section: 2 Services / time synchronisation
    title: A single time synchronisation daemon is configured
    level: 1
    container: config
    exercises: []
    platforms: setting the clock needs CAP_SYS_TIME and changes the HOST clock - configure only

  - id: "2.4"
    section: 2 Services / job schedulers
    title: Cron daemon enabled; cron files and directories restricted; crontab limited by cron.allow
    level: 1
    container: full
    exercises: ["2.05", "3.01", "5.01"]
    platforms: cron/crond/cronie service names; busybox crontab ignores cron.allow

  - id: "3.2"
    section: 3 Network / network kernel modules
    title: Rare network protocols (dccp, tipc, rds, sctp) cannot be loaded
    level: 2
    container: config
    exercises: ["2.03"]
    platforms: some telecom stacks need SCTP

  - id: "3.3"
    section: 3 Network / network kernel parameters
    title: No forwarding, no redirects, no source routing, reverse path filtering, SYN cookies, martian logging
    level: 1
    container: full
    exercises: ["2.04", "3.01", "5.01"]
    platforms: net.* sysctls are per network namespace

  - id: "4"
    section: 4 Host based firewall
    title: A single firewall with default-deny inbound and explicit allows
    level: 1
    container: full
    exercises: ["4.07"]
    platforms: nftables (Debian, EL, Arch, Alpine) vs firewalld (SUSE default); never flush foreign rules

  - id: "5.1"
    section: 5 Access control / SSH server
    title: SSH hardened (no root login, limited auth tries, strong crypto, allow-list, timeouts, banner)
    level: 1
    container: full
    exercises: ["1.03", "2.02", "3.01", "5.01"]
    platforms: ssh vs sshd service name; first match wins; EL crypto-policies included after drop-ins

  - id: "5.2"
    section: 5 Access control / privilege escalation
    title: sudo uses a PTY and logs to a dedicated file; re-authentication not disabled
    level: 1
    container: full
    exercises: ["1.05", "3.01", "5.01"]
    platforms: files in sudoers.d containing a dot are ignored

  - id: "5.3.2"
    section: 5 Access control / PAM - account lockout
    title: Accounts are locked after repeated failed logins (pam_faillock)
    level: 1
    container: full
    exercises: ["4.06"]
    platforms: authselect (EL/Fedora), pam-auth-update (Debian/Ubuntu), pam-config (SUSE), no PAM on Alpine

  - id: "5.3.3"
    section: 5 Access control / PAM - password quality
    title: pam_pwquality enforces length, classes, repetition and dictionary checks (incl. root)
    level: 1
    container: full
    exercises: ["3.03", "4.03", "5.01"]
    platforms: see 5.3.2; Alpine has no PAM by default

  - id: "5.4.1"
    section: 5 Access control / shadow password suite
    title: Password aging defaults, strong hashing (SHA512/yescrypt), inactive accounts locked
    level: 1
    container: full
    exercises: ["3.02", "4.03", "4.04", "5.01"]
    platforms: never downgrade yescrypt; /usr/etc vendor split on openSUSE

  - id: "5.4.2"
    section: 5 Access control / root and system accounts
    title: Root is the only UID 0 account; no account has an empty password
    level: 1
    container: full
    exercises: ["3.05", "4.03", "5.01"]
    platforms: userdel refuses UID 0 aliases without force

  - id: "5.4.3"
    section: 5 Access control / user environment
    title: Default umask 027 and a read-only shell timeout
    level: 1
    container: full
    exercises: ["3.05", "4.03", "5.01"]
    platforms: profile.d is read by bash/dash/ash login shells only

  - id: "6.1"
    section: 6 Logging and auditing / filesystem integrity
    title: AIDE installed, database initialised, regular integrity checks scheduled
    level: 1
    container: full
    exercises: ["4.08"]
    platforms: aideinit (Debian) vs aide --init (EL); database paths differ

  - id: "6.2"
    section: 6 Logging and auditing / system logging
    title: journald/rsyslog configured, logs protected, optionally forwarded
    level: 1
    container: full
    exercises: []
    platforms: busybox syslogd on Alpine

  - id: "6.3"
    section: 6 Logging and auditing / auditd
    title: auditd rules for scope, identity, time, logins, user emulation; immutable rules; retention
    level: 2
    container: config
    exercises: ["3.04", "4.02", "5.01"]
    platforms: the audit subsystem is global - never load rules or start auditd inside containers

  - id: "7.1"
    section: 7 System maintenance / system file permissions
    title: passwd, group, shadow, gshadow and their backups have correct owner, group and mode
    level: 1
    container: full
    exercises: ["1.02", "2.01", "3.01", "5.01"]
    platforms: shadow group/mode convention differs per family

  - id: "7.2"
    section: 7 System maintenance / local users and groups
    title: Consistent passwd/group/shadow, unique UIDs/GIDs/names, safe home directories and dot files
    level: 1
    container: full
    exercises: ["3.05"]
    platforms: "-"
