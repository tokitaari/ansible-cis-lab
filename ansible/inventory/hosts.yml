---
# Lab inventory. Groups by OS family - exactly the dimension that makes
# multi-distro hardening interesting.
all:
  children:
    targets:
      children:
        debian_family:
          hosts:
            debian:
            ubuntu:
        redhat_family:
          hosts:
            rocky:
            alma:
            fedora:
        suse_family:
          hosts:
            opensuse:
        arch_family:
          hosts:
            arch:
        alpine_family:
          hosts:
            alpine:
