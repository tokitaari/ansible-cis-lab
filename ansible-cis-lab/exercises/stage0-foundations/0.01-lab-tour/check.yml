---
- name: Check 0.01 - inventory is complete
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Eight targets in five family groups
      ansible.builtin.assert:
        that:
          - groups['targets'] | length == 8
          - groups['alpine_family'] == ['alpine']
          - groups['redhat_family'] | length == 3
        fail_msg: The inventory was modified - restore /lab/ansible/inventory/hosts.yml
        success_msg: Inventory OK (8 targets)

- name: Check 0.01 - every Python-capable target answers
  hosts: "targets:!alpine_family"
  gather_facts: false
  tasks:
    - name: Ping
      ansible.builtin.ping:
