---
- name: Check 0.02 - Python on Alpine
  hosts: alpine_family
  gather_facts: false
  tasks:
    - name: Module execution works (needs Python)
      ansible.builtin.ping:

    - name: Read Python version
      ansible.builtin.command: python3 --version
      register: pyver
      changed_when: false
      check_mode: false

    - name: Python 3 is present
      ansible.builtin.assert:
        that: pyver.stdout is search('Python 3')
        success_msg: "{{ pyver.stdout }}"
