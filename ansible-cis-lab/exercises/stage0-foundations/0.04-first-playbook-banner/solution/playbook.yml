---
- name: Set a neutral SSH warning banner
  hosts: targets
  become: true
  tasks:
    - name: Write /etc/issue.net without OS information
      ansible.builtin.copy:
        dest: /etc/issue.net
        content: |
          Authorized access only. Activity on this system is monitored and logged.
        owner: root
        group: root
        mode: "0644"
