---
- name: Check 0.04 - SSH warning banner
  hosts: targets
  become: true
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: Stat /etc/issue.net
      ansible.builtin.stat:
        path: /etc/issue.net
      register: st

    - name: Read /etc/issue.net
      ansible.builtin.slurp:
        src: /etc/issue.net
      register: banner

    - name: Banner is a warning without OS details
      vars:
        text: "{{ banner.content | b64decode }}"
        escape_re: '\\[mrsv]'
      ansible.builtin.assert:
        that:
          - text is search('(?i)authori[sz]ed')
          - text is not search(escape_re)
          - text is not search('(?i)' ~ ansible_facts.distribution)
          - st.stat.pw_name == 'root'
          - st.stat.gr_name == 'root'
          - st.stat.mode == '0644'
        fail_msg: >-
          /etc/issue.net must mention 'authorized', contain no \m \r \s \v and no
          distribution name, owner root:root, mode 0644
          (now: {{ st.stat.pw_name }}:{{ st.stat.gr_name }} {{ st.stat.mode }})
        quiet: true
