---
- name: CIS 5.3.3 - password quality
  hosts: debian_family:redhat_family
  become: true
  vars:
    cis_pwquality_package:
      Debian: libpam-pwquality
      RedHat: libpwquality
    cis_pam_password_stack:
      Debian: /etc/pam.d/common-password
      RedHat: /etc/pam.d/system-auth
    cis_pwquality:
      minlen: 14
      minclass: 4
      maxrepeat: 3
      maxsequence: 3
      dictcheck: 1
  tasks:
    - name: Install pwquality
      ansible.builtin.package:
        name: "{{ cis_pwquality_package[ansible_facts.os_family] }}"
        state: present

    - name: Ensure the drop-in directory exists
      ansible.builtin.file:
        path: /etc/security/pwquality.conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy the CIS pwquality drop-in
      ansible.builtin.template:
        src: pwquality-cis.conf.j2
        dest: /etc/security/pwquality.conf.d/50-cis.conf
        owner: root
        group: root
        mode: "0644"

    - name: Read the PAM password stack
      ansible.builtin.slurp:
        src: "{{ cis_pam_password_stack[ansible_facts.os_family] }}"
      register: cis_pam_stack

    - name: Debian - enable the pwquality PAM profile if missing
      ansible.builtin.command: pam-auth-update --enable pwquality
      when:
        - ansible_facts.os_family == 'Debian'
        - "'pam_pwquality' not in (cis_pam_stack.content | b64decode)"
      changed_when: true

    - name: Red Hat - show the active authselect profile
      ansible.builtin.command: authselect current
      register: cis_authselect
      changed_when: false
      check_mode: false
      failed_when: false
      when: ansible_facts.os_family == 'RedHat'

    - name: Red Hat - pam_pwquality must be part of the authselect profile
      ansible.builtin.assert:
        that: "'pam_pwquality' in (cis_pam_stack.content | b64decode)"
        fail_msg: >-
          pam_pwquality missing in system-auth. Active profile:
          {{ cis_authselect.stdout | default('none') }} - select a profile that includes it
          (authselect select local --force) instead of editing PAM files.
        quiet: true
      when: ansible_facts.os_family == 'RedHat'
