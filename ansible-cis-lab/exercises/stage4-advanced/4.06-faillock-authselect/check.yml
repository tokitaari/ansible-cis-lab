---
- name: Check 4.06 - faillock
  hosts: redhat_family
  become: true
  gather_facts: false
  tasks:
    - name: Read files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/security/faillock.conf, /etc/pam.d/system-auth, /etc/pam.d/password-auth]
      register: f
      failed_when: false

    - name: faillock configured and active
      vars:
        conf: "{{ f.results[0].content | default('') | b64decode }}"
        deny: "{{ conf | regex_findall('(?m)^\\s*deny\\s*=\\s*(\\d+)') | last | default(99) | int }}"
        unlock: "{{ conf | regex_findall('(?m)^\\s*unlock_time\\s*=\\s*(\\d+)') | last | default(-1) | int }}"
      ansible.builtin.assert:
        that:
          - deny | int in range(1, 6)
          - unlock | int == 0 or unlock | int >= 900
          - (f.results[1].content | default('') | b64decode) is search('pam_faillock')
          - (f.results[2].content | default('') | b64decode) is search('pam_faillock')
        fail_msg: "deny={{ deny }} unlock_time={{ unlock }}; pam_faillock must be in system-auth and password-auth"
        quiet: true
