---
- name: 2.2 | Remove insecure client packages
  ansible.builtin.package:
    name: "{{ cis_remove_packages }}"
    state: absent
  tags: [packages]

- name: 2.1 | Collect package facts
  ansible.builtin.package_facts:
  tags: [services]

- name: 2.1 | Stop and disable unneeded services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ cis_disable_services }}"
  when: item in ansible_facts.packages
  tags: [services]

- name: 2.4 | Find existing cron paths
  ansible.builtin.stat:
    path: "{{ item.path }}"
  loop: "{{ cis_cron_paths }}"
  register: cis_cron_stat
  tags: [cron]

- name: 2.4 | Restrict cron files and directories
  ansible.builtin.file:
    path: "{{ item.item.path }}"
    owner: root
    group: root
    mode: "{{ item.item.mode }}"
  loop: "{{ cis_cron_stat.results }}"
  loop_control:
    label: "{{ item.item.path }}"
  when: item.stat.exists
  tags: [cron]

- name: 2.4 | Restrict crontab usage to root
  ansible.builtin.copy:
    dest: /etc/cron.allow
    content: "root\n"
    owner: root
    group: root
    mode: "0640"
  when: cis_cron_allow_supported
  tags: [cron]

- name: 2.4 | Remove cron.deny
  ansible.builtin.file:
    path: /etc/cron.deny
    state: absent
  when: cis_cron_allow_supported
  tags: [cron]

- name: 2.4 | Restrict the cron spool where cron.allow is not supported
  ansible.builtin.file:
    path: /etc/crontabs
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: not cis_cron_allow_supported
  tags: [cron]

- name: 2.4 | Cron daemon is enabled and running
  ansible.builtin.service:
    name: "{{ cis_cron_service }}"
    state: started
    enabled: true
  tags: [cron]
