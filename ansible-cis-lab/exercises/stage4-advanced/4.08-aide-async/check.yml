---
- name: Check 4.08 - AIDE
  hosts: debian_family:redhat_family
  become: true
  gather_facts: true
  gather_subset: [min]
  vars:
    db:
      Debian: /var/lib/aide/aide.db
      RedHat: /var/lib/aide/aide.db.gz
  tasks:
    - name: Database exists
      ansible.builtin.stat:
        path: "{{ db[ansible_facts.os_family] }}"
      register: st

    - name: Timer state
      ansible.builtin.command: systemctl is-enabled cis-aidecheck.timer
      register: timer
      changed_when: false
      failed_when: false
      check_mode: false

    - name: AIDE initialised and scheduled
      ansible.builtin.assert:
        that:
          - st.stat.exists
          - timer.stdout | trim == 'enabled'
        fail_msg: "db={{ st.stat.exists }} timer={{ timer.stdout | default('') }}"
        quiet: true
