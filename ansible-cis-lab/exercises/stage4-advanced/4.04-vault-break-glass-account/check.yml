---
- name: Check 4.04 - vault file
  hosts: localhost
  gather_facts: false
  tasks:
    - name: vault.yml is encrypted
      ansible.builtin.assert:
        that: lookup('ansible.builtin.pipe', 'head -c 14 /lab/work/4.04/vault.yml 2>/dev/null || true') == '$ANSIBLE_VAULT'
        fail_msg: /lab/work/4.04/vault.yml missing or not encrypted with ansible-vault

- name: Check 4.04 - break-glass account
  hosts: targets:!alpine_family
  become: true
  gather_facts: false
  tasks:
    - name: Read shadow and sudoers drop-in
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/shadow, /etc/sudoers.d/60-cisadmin]
      register: f
      failed_when: false

    - name: Evaluate
      vars:
        entry: "{{ (f.results[0].content | b64decode).splitlines() | select('match', '^cisadmin:') | first | default('') }}"
        fields: "{{ entry.split(':') }}"
        sudo: "{{ f.results[1].content | default('') | b64decode }}"
      ansible.builtin.assert:
        that:
          - entry | length > 0
          - fields[1] is match('^\$(6|y)\$')
          - fields[3] | int >= 1
          - fields[4] | int == 365
          - sudo is search('(?m)^\s*cisadmin\s+ALL\s*=\s*\(ALL(:ALL)?\)\s+ALL\s*$')
          - sudo is not search('NOPASSWD')
        fail_msg: "cisadmin must exist with a SHA-512/yescrypt hash, min 1 / max 365 days, and a sudoers rule without NOPASSWD"
        quiet: true
