---
- name: Check 4.05 - custom facts
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Gather local facts
      ansible.builtin.setup:
        filter: ansible_local

    - name: Stat fact files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/ansible/facts.d/cis.fact, /etc/ansible/facts.d/cis_live.fact]
      register: st

    - name: Facts are present and well-formed
      ansible.builtin.assert:
        that:
          - ansible_local.cis.baseline == 'lab-cis'
          - ansible_local.cis.version is defined
          - ansible_local.cis.level is defined
          - ansible_local.cis_live.uid0_accounts | int >= 1
          - ansible_local.cis_live.permit_root_login | length > 0
          - st.results[0].stat.mode == '0644'
          - st.results[1].stat.mode == '0755'
          - st.results[1].stat.pw_name == 'root'
        fail_msg: "ansible_local = {{ ansible_local | default({}) }}"
        quiet: true

- name: Check 4.05 - report
  hosts: localhost
  gather_facts: false
  tasks:
    - name: inventory.md lists all targets
      vars:
        md: "{{ lookup('ansible.builtin.file', '/lab/work/4.05/inventory.md', errors='ignore') | default('', true) }}"
      ansible.builtin.assert:
        that: groups['targets'] | reject('in', md) | list | length == 0
        fail_msg: /lab/work/4.05/inventory.md missing or incomplete
