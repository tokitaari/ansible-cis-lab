---
- name: CIS audit (read-only)
  hosts: targets
  become: true
  gather_facts: true
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Stat account files and cron.allow
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/passwd, /etc/shadow, /etc/cron.allow]
      register: cis_stat

    - name: Read files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/passwd, /etc/sudoers.d/50-cis]
      register: cis_files
      failed_when: false

    - name: Effective sshd configuration
      ansible.builtin.command: /usr/sbin/sshd -T
      register: cis_sshd_t
      changed_when: false
      check_mode: false

    - name: IP forwarding
      ansible.builtin.command: sysctl -n net.ipv4.ip_forward
      register: cis_ip_forward
      changed_when: false
      check_mode: false

    - name: Evaluate controls
      vars:
        sshd: "{{ dict(cis_sshd_t.stdout_lines | map('regex_replace', '^(\\S+)\\s+(.*)$', '\\1\t\\2') | map('split', '\t')) }}"
        passwd_st: "{{ cis_stat.results[0].stat }}"
        shadow_st: "{{ cis_stat.results[1].stat }}"
        cron_allow_st: "{{ cis_stat.results[2].stat }}"
        passwd: "{{ cis_files.results[0].content | b64decode }}"
        sudo_cis: "{{ cis_files.results[1].content | default('') | b64decode }}"
        vsftpd: "{{ ansible_facts.services['vsftpd.service'] | default(ansible_facts.services['vsftpd'] | default({})) }}"
        uid0: "{{ passwd.splitlines() | map('split', ':') | selectattr('2', 'equalto', '0') | map(attribute='0') | list }}"
      ansible.builtin.set_fact:
        cis_results:
          - id: "2.2"
            title: telnet client is not installed
            status: "{{ 'pass' if 'telnet' not in ansible_facts.packages else 'fail' }}"
          - id: "2.1"
            title: vsftpd is not running and not enabled
            status: >-
              {{ 'pass' if (vsftpd.state | default('stopped')) not in ['running', 'started']
                 and (vsftpd.status | default('disabled')) != 'enabled' else 'fail' }}
          - id: "7.1"
            title: /etc/passwd is 0644 root:root
            status: "{{ 'pass' if passwd_st.mode == '0644' and passwd_st.pw_name == 'root' and passwd_st.gr_name == 'root' else 'fail' }}"
          - id: "7.1"
            title: /etc/shadow is not accessible by others
            status: "{{ 'pass' if not (shadow_st.roth or shadow_st.woth or shadow_st.xoth or shadow_st.wgrp) else 'fail' }}"
          - id: "5.1"
            title: PermitRootLogin is no
            status: "{{ 'pass' if sshd.permitrootlogin == 'no' else 'fail' }}"
          - id: "5.1"
            title: MaxAuthTries is 4 or less
            status: "{{ 'pass' if sshd.maxauthtries | int <= 4 else 'fail' }}"
          - id: "5.2"
            title: sudo uses a pseudo terminal
            status: "{{ 'pass' if sudo_cis is search('(?m)^\\s*Defaults\\s+use_pty') else 'fail' }}"
          - id: "3.3"
            title: IP forwarding is disabled
            status: "{{ 'pass' if cis_ip_forward.stdout | trim == '0' else 'fail' }}"
          - id: "2.4"
            title: /etc/cron.allow exists
            status: "{{ 'n/a' if ansible_facts.os_family == 'Alpine' else ('pass' if cron_allow_st.exists else 'fail') }}"
          - id: "5.4.2"
            title: root is the only UID 0 account
            status: "{{ 'pass' if uid0 == ['root'] else 'fail' }}"

- name: Write the compliance report
  hosts: localhost
  gather_facts: false
  vars:
    report_dir: /lab/work/4.01
  tasks:
    - name: Build the report structure
      vars:
        host_reports: >-
          {%- set ns = namespace(r={}) -%}
          {%- for h in groups['targets'] | sort if hostvars[h].cis_results is defined -%}
            {%- set res = hostvars[h].cis_results -%}
            {%- set p = res | selectattr('status', 'equalto', 'pass') | list | length -%}
            {%- set f = res | selectattr('status', 'equalto', 'fail') | list | length -%}
            {%- set ns.r = ns.r | combine({h: {'score': ((p / ([p + f, 1] | max)) * 100) | round(1), 'results': res}}) -%}
          {%- endfor -%}
          {{ ns.r }}
      ansible.builtin.set_fact:
        cis_report: "{{ host_reports }}"

    - name: Ensure the report directory exists
      ansible.builtin.file:
        path: "{{ report_dir }}"
        state: directory
        mode: "0755"

    - name: Write JSON
      ansible.builtin.copy:
        dest: "{{ report_dir }}/report.json"
        content: "{{ cis_report | to_nice_json }}\n"
        mode: "0644"

    - name: Write Markdown
      ansible.builtin.template:
        src: report.md.j2
        dest: "{{ report_dir }}/report.md"
        mode: "0644"
