---
- name: Check 4.07 - nftables
  hosts: targets:!suse_family
  become: true
  gather_facts: true
  gather_subset: [min]
  vars:
    persist:
      Debian: /etc/nftables.conf
      RedHat: /etc/sysconfig/nftables.conf
      Archlinux: /etc/nftables.conf
      Alpine: /etc/nftables.nft
  tasks:
    - name: Live table
      ansible.builtin.command: nft list table inet cis_filter
      register: live
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Persistence file
      ansible.builtin.slurp:
        src: "{{ persist[ansible_facts.os_family] }}"
      register: pf
      failed_when: false

    - name: Firewall active, SSH allowed, persisted without flush
      vars:
        pf_text: "{{ pf.content | default('') | b64decode }}"
      ansible.builtin.assert:
        that:
          - live.rc == 0
          - live.stdout is search('hook input priority filter; policy drop;')
          - live.stdout is search('tcp dport 22')
          - live.stdout is search('ct state established,related accept')
          - live.stdout is search('hook forward priority filter; policy drop;')
          - pf_text is search('include\s+"/etc/cis/nftables-cis.nft"')
          - pf_text is not search('(?m)^\s*flush\s+ruleset')
        fail_msg: "table inet cis_filter must be loaded (input/forward policy drop, ssh allowed) and included from {{ persist[ansible_facts.os_family] }} without 'flush ruleset'"
        quiet: true
