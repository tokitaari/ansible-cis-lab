---
- name: Disable the FTP server
  hosts: targets
  become: true
  tasks:
    - name: Collect package facts
      ansible.builtin.package_facts:

    - name: Stop and disable vsftpd
      ansible.builtin.service:
        name: vsftpd
        state: stopped
        enabled: false
      when: "'vsftpd' in ansible_facts.packages"
