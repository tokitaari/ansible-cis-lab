---
- name: Harden sudo
  hosts: targets
  become: true
  tasks:
    - name: Deploy sudo defaults
      ansible.builtin.copy:
        dest: /etc/sudoers.d/50-cis
        content: |
          Defaults use_pty
          Defaults logfile="/var/log/sudo.log"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
