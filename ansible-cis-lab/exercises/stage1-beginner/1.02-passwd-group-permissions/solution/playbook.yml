---
- name: Fix account file permissions
  hosts: targets
  become: true
  tasks:
    - name: Set /etc/passwd to 0644 root:root
      ansible.builtin.file:
        path: /etc/passwd
        owner: root
        group: root
        mode: "0644"

    - name: Set /etc/group to 0644 root:root
      ansible.builtin.file:
        path: /etc/group
        owner: root
        group: root
        mode: "0644"
