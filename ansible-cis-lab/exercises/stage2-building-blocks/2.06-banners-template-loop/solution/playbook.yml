---
- name: CIS 1.6 - warning banners
  hosts: targets
  become: true
  tasks:
    - name: Deploy login banners
      ansible.builtin.template:
        src: banner.j2
        dest: "{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - /etc/motd
        - /etc/issue
        - /etc/issue.net
