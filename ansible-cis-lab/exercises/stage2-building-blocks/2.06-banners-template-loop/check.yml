---
- name: Check 2.06 - all login banners
  hosts: targets
  become: true
  gather_facts: true
  gather_subset: [min]
  tasks:
    - name: Read banner files
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop: [/etc/motd, /etc/issue, /etc/issue.net]
      register: banners
      failed_when: false

    - name: Stat banner files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/motd, /etc/issue, /etc/issue.net]
      register: st

    - name: Banners are neutral, mention the organisation and are 0644 root:root
      vars:
        text: "{{ item.0.content | default('') | b64decode }}"
        escape_re: '\\[mrsv]'
      ansible.builtin.assert:
        that:
          - text is search(lab_org_name | regex_escape)
          - text is search('(?i)authori[sz]ed')
          - text is not search(escape_re)
          - text is not search('(?i)' ~ ansible_facts.distribution)
          - item.1.stat.mode == '0644'
          - item.1.stat.pw_name == 'root'
          - item.1.stat.gr_name == 'root'
        fail_msg: "{{ item.0.item }}: needs '{{ lab_org_name }}', 'authorized', no OS info, 0644 root:root"
        quiet: true
      loop: "{{ banners.results | zip(st.results) | list }}"
      loop_control:
        label: "{{ item.0.item }}"
