---
- name: Check 2.01 - shadow file permissions
  hosts: targets
  become: true
  gather_facts: false
  tasks:
    - name: Stat shadow files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: [/etc/shadow, /etc/gshadow]
      register: st

    - name: Owner root, group root/shadow, at most 0640
      ansible.builtin.assert:
        that:
          - item.stat.pw_name == 'root'
          - item.stat.gr_name in ['root', 'shadow']
          - not item.stat.xusr
          - not item.stat.wgrp and not item.stat.xgrp
          - not item.stat.roth and not item.stat.woth and not item.stat.xoth
        fail_msg: "{{ item.item }} is {{ item.stat.mode }} {{ item.stat.pw_name }}:{{ item.stat.gr_name }} - must be root:(root|shadow), 0640 or stricter"
        quiet: true
      loop: "{{ st.results | selectattr('stat.exists') | list }}"
      loop_control:
        label: "{{ item.item }}"
