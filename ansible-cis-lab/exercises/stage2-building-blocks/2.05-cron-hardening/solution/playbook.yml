---
- name: CIS 2.4 - job schedulers
  hosts: targets
  become: true
  vars:
    cron_service:
      Debian: cron
      RedHat: crond
      Suse: cron
      Archlinux: cronie
      Alpine: crond
    cron_paths:
      - {path: /etc/crontab, mode: "0600"}
      - {path: /etc/cron.hourly, mode: "0700"}
      - {path: /etc/cron.daily, mode: "0700"}
      - {path: /etc/cron.weekly, mode: "0700"}
      - {path: /etc/cron.monthly, mode: "0700"}
      - {path: /etc/cron.d, mode: "0700"}
  tasks:
    - name: Find existing cron paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop: "{{ cron_paths }}"
      register: cron_stat

    - name: Restrict cron files and directories
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ cron_stat.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists

    - name: Restrict crontab usage to root (not supported by busybox crontab)
      ansible.builtin.copy:
        dest: /etc/cron.allow
        content: "root\n"
        owner: root
        group: root
        mode: "0640"
      when: ansible_facts.os_family != 'Alpine'

    - name: Remove cron.deny (ignored once cron.allow exists)
      ansible.builtin.file:
        path: /etc/cron.deny
        state: absent
      when: ansible_facts.os_family != 'Alpine'

    - name: Alpine - restrict the spool directory instead
      ansible.builtin.file:
        path: /etc/crontabs
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: ansible_facts.os_family == 'Alpine'

    - name: Cron daemon is enabled and running
      ansible.builtin.service:
        name: "{{ cron_service[ansible_facts.os_family] }}"
        state: started
        enabled: true
