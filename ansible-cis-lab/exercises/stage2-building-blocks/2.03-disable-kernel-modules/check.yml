---
- name: Check 2.03 - kernel modules disabled
  hosts: targets
  become: true
  gather_facts: false
  vars:
    modules: [cramfs, freevxfs, hfs, hfsplus, jffs2, usb-storage]
  tasks:
    - name: Read modprobe.d files
      ansible.builtin.slurp:
        src: "/etc/modprobe.d/cis-{{ item }}.conf"
      loop: "{{ modules }}"
      register: files
      failed_when: false

    - name: install /bin/false + blacklist for each module
      vars:
        text: "{{ item.content | default('') | b64decode }}"
      ansible.builtin.assert:
        that:
          - text is search('(?m)^install\s+' ~ item.item ~ '\s+/(usr/)?bin/false\s*$')
          - text is search('(?m)^blacklist\s+' ~ item.item ~ '\s*$')
        fail_msg: "/etc/modprobe.d/cis-{{ item.item }}.conf missing or incomplete"
        quiet: true
      loop: "{{ files.results }}"
      loop_control:
        label: "{{ item.item }}"
