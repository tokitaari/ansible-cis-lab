---
- name: 6.3 | Install the audit framework
  ansible.builtin.package:
    name: "{{ cis_audit_package }}"
    state: present
  register: cis_r_1

- name: 6.3 | Rules directory
  ansible.builtin.file:
    path: /etc/audit/rules.d
    state: directory
    owner: root
    group: root
    mode: "0750"
  register: cis_r_2

- name: 6.3 | One rule file per topic
  ansible.builtin.template:
    src: audit.rules.j2
    dest: "/etc/audit/rules.d/50-cis-{{ item.key }}.rules"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ cis_audit_rules | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  register: cis_r_3

- name: 6.3 | Immutable configuration
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/99-cis-finalize.rules
    content: "-e 2\n"
    owner: root
    group: root
    mode: "0640"
  register: cis_r_4

- name: 6.3 | Log retention and space actions
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: '^\s*{{ item.key }}\s*='
    line: "{{ item.key }} = {{ item.value }}"
  loop: "{{ cis_auditd_conf | dict2items }}"
  register: cis_r_5

- name: 6.3 | Enable and start auditd (real hosts only)
  ansible.builtin.service:
    name: auditd
    state: started
    enabled: true
  when: cis_manage_auditd_service | bool
  register: cis_r_6

- name: 6.3 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}", "{{ cis_r_2 }}", "{{ cis_r_3 }}", "{{ cis_r_4 }}", "{{ cis_r_5 }}", "{{ cis_r_6 }}"]
