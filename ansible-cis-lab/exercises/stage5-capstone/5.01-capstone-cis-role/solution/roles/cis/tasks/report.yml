---
- name: Report | summarise per host
  ansible.builtin.set_fact:
    cis_summary:
      mode: "{{ cis_mode }}"
      level: "{{ cis_level | int }}"
      platform: "{{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}"
      counts: >-
        {%- set ns = namespace(c={}) -%}
        {%- for s in ['pass', 'fixed', 'fail', 'excepted', 'out-of-profile', 'not-applicable'] -%}
          {%- set ns.c = ns.c | combine({s: cis_findings | selectattr('status', 'equalto', s) | list | length}) -%}
        {%- endfor -%}
        {{ ns.c }}
      findings: "{{ cis_findings }}"

- name: Report | create the report directory
  ansible.builtin.file:
    path: "{{ cis_report_dir }}"
    state: directory
    mode: "0755"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false

- name: Report | write JSON
  ansible.builtin.copy:
    dest: "{{ cis_report_dir }}/compliance.json"
    content: "{{ dict(ansible_play_hosts | zip(ansible_play_hosts | map('extract', hostvars, 'cis_summary'))) | to_nice_json }}\n"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false

- name: Report | write Markdown
  ansible.builtin.template:
    src: report.md.j2
    dest: "{{ cis_report_dir }}/compliance.md"
    mode: "0644"
  delegate_to: localhost
  become: false
  run_once: true
  check_mode: false
  # an output on the control node, not managed state - keep the targets' recap clean
  changed_when: false
