---
- name: Preflight | mode and level are valid
  ansible.builtin.assert:
    that:
      - cis_mode in ['enforce', 'audit']
      - cis_level | int in [1, 2]
    fail_msg: "cis_mode must be enforce|audit (is {{ cis_mode }}), cis_level 1|2 (is {{ cis_level }})"
    quiet: true

- name: Preflight | every exception is documented and not expired
  ansible.builtin.assert:
    that:
      - item.id is defined
      - item.id in (cis_controls | map(attribute='id'))
      - (item.reason | default('') | trim | length) > 0
      - item.expires is defined
      - (item.expires | string | to_datetime('%Y-%m-%d')) > now()
    fail_msg: >-
      Invalid exception {{ item }} - it needs a known id, a reason and a
      future expiry date (YYYY-MM-DD)
    quiet: true
  loop: "{{ cis_exceptions }}"
  loop_control:
    label: "{{ item.id | default('?') }}"

- name: Preflight | collect exception ids
  ansible.builtin.set_fact:
    cis_exception_ids: "{{ cis_exceptions | map(attribute='id') | list }}"
