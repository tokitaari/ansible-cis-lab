---
- name: 1.1.1-L2 | Ensure /etc/modprobe.d exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  register: cis_r_0

- name: 1.1.1-L2 | Disable Level 2 kernel modules
  ansible.builtin.copy:
    dest: "/etc/modprobe.d/cis-{{ item }}.conf"
    content: |
      install {{ item }} /bin/false
      blacklist {{ item }}
    owner: root
    group: root
    mode: "0644"
  loop: "{{ cis_disabled_modules_l2 }}"
  # in audit mode a missing directory is already the finding
  when: not (cis_mode == 'audit' and cis_r_0 is changed)
  register: cis_r_1

- name: 1.1.1-L2 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_0 }}", "{{ cis_r_1 }}"]
