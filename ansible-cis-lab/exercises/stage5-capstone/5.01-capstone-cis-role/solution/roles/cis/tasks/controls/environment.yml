---
- name: 5.4.3 | Default umask
  ansible.builtin.copy:
    dest: /etc/profile.d/50-cis-umask.sh
    content: |
      # CIS 5.4.3 - default umask
      umask {{ cis_umask }}
    owner: root
    group: root
    mode: "0644"
  register: cis_r_1

- name: 5.4.3 | Shell timeout
  ansible.builtin.copy:
    dest: /etc/profile.d/50-cis-tmout.sh
    content: |
      # CIS 5.4.3 - shell timeout
      TMOUT={{ cis_tmout }}
      readonly TMOUT
      export TMOUT
    owner: root
    group: root
    mode: "0644"
  register: cis_r_2

- name: 5.4.3 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}", "{{ cis_r_2 }}"]
