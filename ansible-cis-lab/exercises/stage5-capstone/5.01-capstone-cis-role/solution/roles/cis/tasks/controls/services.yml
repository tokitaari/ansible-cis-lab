---
- name: 2.1 | Collect package facts
  ansible.builtin.package_facts:

- name: 2.1 | Stop and disable unneeded services
  ansible.builtin.service:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ cis_disable_services }}"
  when: item in ansible_facts.packages
  register: cis_r_1

- name: 2.1 | Results
  ansible.builtin.set_fact:
    cis_control_results: ["{{ cis_r_1 }}"]
