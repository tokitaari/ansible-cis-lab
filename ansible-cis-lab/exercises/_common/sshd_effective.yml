---
# Shared by the check playbooks: reads the *effective* sshd configuration
# (sshd -T, as root) and exposes it as the dict 'sshd_cfg' (keys are lower case).
- name: Run sshd -T
  ansible.builtin.command: /usr/sbin/sshd -T
  register: sshd_t
  changed_when: false
  check_mode: false

- name: Parse into sshd_cfg
  ansible.builtin.set_fact:
    sshd_cfg: "{{ dict(sshd_t.stdout_lines | map('regex_replace', '^(\\S+)\\s+(.*)$', '\\1\t\\2') | map('split', '\t')) }}"
