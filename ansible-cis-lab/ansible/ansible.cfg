# Lab-wide Ansible configuration (selected via ANSIBLE_CONFIG in the control node)
[defaults]
inventory = /lab/ansible/inventory/hosts.yml
remote_user = ansible
private_key_file = /lab-keys/id_ed25519
host_key_checking = False
interpreter_python = auto_silent
roles_path = /lab/work/roles:/lab/ansible/roles
forks = 10
timeout = 30
callback_result_format = yaml
nocows = True

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -o LogLevel=ERROR
